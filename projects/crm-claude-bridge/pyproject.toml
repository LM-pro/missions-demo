[tool.poetry]
name = "crm-claude-bridge"
version = "0.1.0"
description = "Async ETL pipeline that enriches and qualifies B2B leads with Claude."
authors = ["Thorsen <hello@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.40.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.5.0"

[tool.poetry.scripts]
crm-bridge = "src.bridge:_cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
