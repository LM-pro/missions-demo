[tool.poetry]
name = "claude-dm-qualifier"
version = "0.1.0"
description = "Instagram/WhatsApp DM Sales Setter powered by Claude API — auto-qualify leads, score, and notify."
authors = ["Thorsen <thorsen@omega.stack>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.40.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.5.0"

[tool.poetry.scripts]
dm-qualifier = "main:parse_args"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
